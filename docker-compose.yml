version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: karaokefactory-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: karaokefactory
      POSTGRES_PASSWORD: karaokefactory_dev_123
      POSTGRES_DB: karaokefactory
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
